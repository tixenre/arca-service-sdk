[project]
name = "arca-service-client"
# Arranca en 0.0.1 (no 0.1.0) — SemVer real recién cuando el contrato público se
# estabilice con uso real, no por haber escrito código. NO se bumpea en cada commit —
# solo cuando cambia la superficie pública (__all__) de forma que un consumidor
# necesite enterarse.
version = "0.0.10"
description = "Cliente HTTP oficial para arca-service (facturación electrónica ARCA/AFIP) — mTLS + API key, sin dependencias pesadas."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

# Core mínimo a propósito: quien consume esto no debería arrastrar dependencias
# pesadas de framework solo para hablar HTTP con arca-service. httpx: transporte
# (soporta mTLS vía `cert=(cert_path, key_path)` nativamente, a diferencia de
# `requests`, que necesita un adapter propio para eso). cryptography: solo la usa
# `crypto.py::seal()` (RSA-OAEP + AES-256-GCM — ver ese módulo para el detalle del
# esquema).
dependencies = [
    "httpx>=0.27",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.24",
    "ruff",
    "black",
    "mypy",
]

# `arca-service-client login`/`whoami` -- ver cli.py. Mismo criterio que `stripe`/`gh`:
# el paquete YA ES el CLI, no uno aparte -- ya trae httpx+cryptography, nada nuevo que
# instalar solo por esto.
[project.scripts]
arca-service-client = "arca_service_client.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Layout real: este pyproject.toml vive en arca_service_client/ (afuera) y el código
# real está un nivel más adentro, en arca_service_client/arca_service_client/ (mismo
# nombre repetido, no un typo). Lo que hubo ACÁ antes (`[tool.setuptools.packages.find]` con
# `where=[".."]` + `include=["arca_service_client*"]`) matcheaba DOS paquetes a la vez:
# el real anidado (`arca_service_client.arca_service_client`, con código) Y un namespace
# package implícito vacío al nivel de arriba (`arca_service_client`, sin `__init__.py`
# propio — PEP 420). pip instalaba los dos, y como `import arca_service_client` (el
# import que muestra el propio README) resuelve al namespace VACÍO —no al anidado—,
# CUALQUIER instalación vía `pip install ...git+...#subdirectory=arca_service_client`
# (el método que el README documenta) quedaba sin ninguna clase/función real. Solo
# "andaba" en editable local (`pip install -e .`, que es como corren los tests de este
# paquete) — nunca se detectó porque nadie lo instaló como consumidor real hasta ahora.
# Fix: mapeo EXPLÍCITO, sin glob ni auto-find — un único paquete real, sin ambigüedad
# de namespace posible.
[tool.setuptools]
packages = ["arca_service_client"]
package-dir = { "arca_service_client" = "arca_service_client" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" -- un `async def test_...` corre como test async sin decorator propio (los
# tests sync existentes no se ven afectados). Hace falta desde que existe
# test_async_client.py (ver ese archivo, mockea AsyncArcaServiceClient).
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
# Sin esto, mypy sigue el import de httpx (que trae `py.typed`) hasta adentro de
# httpx/_main.py (su CLI opcional, no algo que este paquete use) y de ahí a `click` —
# cuyo código fuente usa `match` (sintaxis 3.10+) y explota al PARSEAR bajo
# python_version=3.9 de acá arriba ("silent" no alcanza: sigue parseando el módulo
# aunque calle sus errores; "skip" no lo abre en absoluto). Estándar para consumir una
# librería tipada sin quedar expuesto a la sintaxis/versión de Python de SUS internals.
follow_imports = "skip"
